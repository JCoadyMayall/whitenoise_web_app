<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <title>White Noise</title>
    <link href="{% static 'css/output.css' %}" rel="stylesheet" type="text/css" />
</head>
<body class="min-h-screen flex flex-col">
<div class="navbar bg-base-100 shadow-lg gap-2 justify-center sticky top-0 z-50">
    <div>
        <a class="btn btn-ghost text-xl">White Noise</a>
    </div>
    <div class="mx-12">
        <button id="stop-btn" class="btn btn-soft btn-error">Stop</button>
    </div>
    <div>
        <label class="flex cursor-pointer gap-2">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="12" cy="12" r="5" />
            <path
              d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" />
          </svg>
            <input type="checkbox" value="silk" class="toggle theme-controller" />
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </label>
    </div>
</div>
<main class="flex-1">
{% block content %}
{% endblock %}
</main>
<footer class="footer footer-horizontal bg-neutral text-neutral-content items-center p-4">
  <aside class="grid-flow-col items-center">
    <img src="../../static/images/robin.svg" alt="Robin SVG" width="64" height="64" />
    <p>Jacob C-M © {% now "Y" %} - All right reserved</p>
  </aside>
  <nav class="grid-flow-col gap-4 justify-self-end">
    <a href="https://www.linkedin.com/in/jacob-coady-mayall-5b7272175/" target="_blank">
        <img src="../../static/images/linkedin.svg" alt="LinkedIn Logo" width="48" height="48" />
    </a>
    <a href="https://github.com/BeardyJake" target="_blank">
        <img src="../../static/images/github.svg" alt="Github Logo" width="48" height="48" />
    </a>
  </nav>
</footer>
<script src="{% static 'js/playStopAudio.js' %}"></script>
</body>
</html>
