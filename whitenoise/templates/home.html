<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    {% load static %}
    <link href="{% static 'css/output.css' %}" rel="stylesheet" type="text/css" />
</head>
<body>
<div class="flex flex-row">
    <div class="card bg-base-100 w-96 shadow-sm">
      <figure>
        <img
          src="{% static 'images/calming_rain.jpeg' %}"
          alt="Calming Rain" />
      </figure>
      <div class="card-body">
        <h2 class="card-title">Calming Rain</h2>
        <audio controls class="w-full">
            <source src="{% static 'audio/calming_rain.mp3' %}" type="audio/mpeg">
        </audio>
      </div>
    </div>
</div>
</body>
</html>
