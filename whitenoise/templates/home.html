{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>White Noise</title>
    <link href="{% static 'css/output.css' %}" rel="stylesheet" type="text/css" />
</head>
<body>
<div class="navbar bg-base-100 shadow-sm">
    <a class="btn btn-ghost text-xl">White Noise</a>
    <label class="flex cursor-pointer gap-2">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round">
        <circle cx="12" cy="12" r="5" />
        <path
          d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" />
      </svg>
        <input type="checkbox" value="silk" class="toggle theme-controller" />
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </label>
</div>
<div class="m-4">
    <div class="card card-border bg-base-100 w-96 shadow-xl glass">
      <figure>
        <img
          src="{% static 'images/calming_rain.jpeg' %}"
          alt="Calming Rain" />
      </figure>
      <div class="card-body items-center">
        <h2 class="card-title">Calming Rain</h2>
          <div class="flex flex-row justify-center">
              <button id="play-btn" data-audio-src="{% static 'audio/calming_rain.mp3' %}"
                      class="btn btn-soft btn-secondary m-4">
                  ▶️
              </button>
                <script src="{% static 'js/helpers.js' %}"></script>
              <button class="btn btn-soft btn-secondary m-4">⏹️</button>
          </div>
      </div>
    </div>
</div>
</body>
</html>
