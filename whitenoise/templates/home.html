{% extends 'base.html' %}
{% block content %}
{% load static %}

<div class="flex flex-row flex-wrap justify-center">
    <div class="m-4">
        <div class="card card-border bg-base-100 w-96 h-128 shadow-xl glass">
          <figure>
            <img
              src="{% static 'images/calming_rain.jpeg' %}"
              alt="Rain falling on tree branch with green leaves." />
          </figure>
          <div class="card-body items-center">
            <h2 class="card-title">Calming Rain</h2>
              <div class="flex flex-row justify-center">
                  <button name="play-btn" data-audio-src="{% static 'audio/calm_rain.mp3' %}"
                          class="btn btn-soft btn-secondary m-4">
                      ▶️
                  </button>
              </div>
          </div>
        </div>
    </div>
